<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduler</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>

<header class="bar">
  <nav class="seg" aria-label="View">
    <button type="button" data-view="plan" class="active">Free time</button>
    <button type="button" data-view="calendar">Calendar</button>
    <button type="button" data-view="list">List</button>
  </nav>
  <div class="controls">
    <button id="refresh" type="button" title="Re-fetch data">refresh</button>
    <button id="settings-toggle" type="button" class="text" aria-expanded="false">Settings</button>
  </div>
</header>

<aside id="settings" class="panel" hidden>
  <div class="panel-inner">
    <section class="prefs">
      <div class="pref">
        <label for="bg-style">background</label>
        <select id="bg-style">
          <option value="none">none</option>
          <option value="dots">dots</option>
          <option value="constellation">constellation</option>
          <option value="water">water</option>
          <option value="smoke">smoke</option>
          <option value="boids">boids</option>
          <option value="soccer">soccer</option>
          <option value="pong">pong</option>
          <option value="cars">cars</option>
        </select>
      </div>
      <div class="pref">
        <label for="lunch-start">lunch</label>
        <span class="inline"><input id="lunch-start" type="time" step="300"> – <input id="lunch-end" type="time" step="300"></span>
      </div>
      <div class="pref">
        <label for="clock-seconds">clock</label>
        <label class="check"><input type="checkbox" id="clock-seconds"> seconds</label>
      </div>
      <div class="pref">
        <label for="passphrase">data</label>
        <form id="unlock-form" class="inline">
          <input id="passphrase" type="password" placeholder="passphrase" autocomplete="current-password" required>
          <button type="submit">unlock</button>
        </form>
      </div>
      <p id="status" class="status"></p>
      <p id="meta" class="hint"></p>
      <details>
        <summary>more</summary>
        <label class="file-row"><span>canvas .ics</span><input id="feed-file" type="file" accept=".ics,text/calendar"></label>
        <label class="file-row"><span>schedule .ics</span><input id="sched-file" type="file" accept=".ics,text/calendar"></label>
        <button id="forget" type="button" class="text danger">forget passphrase and cached data</button>
      </details>
    </section>

    <section id="mapping" hidden>
      <div class="map-row map-head"><span>class</span><span>canvas course</span><span>nickname</span></div>
      <div id="mapping-rows"></div>
    </section>
  </div>
</aside>

<main id="results" hidden>
  <div id="plan" hidden>
    <div class="subbar">
      <div class="nav">
        <button type="button" id="plan-prev" aria-label="Previous day">‹</button>
        <button type="button" id="plan-next" aria-label="Next day">›</button>
      </div>
      <h1 id="plan-date" title="Back to today"></h1>
      <span id="count" class="count"></span>
    </div>
    <div id="plan-body"></div>
  </div>

  <div id="calendar" hidden>
    <div class="subbar">
      <div class="nav">
        <button type="button" id="cal-prev" aria-label="Previous week">‹</button>
        <button type="button" id="cal-next" aria-label="Next week">›</button>
      </div>
      <h1 id="cal-range" title="Back to this week"></h1>
      <span id="cal-count" class="count"></span>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
  </div>

  <div id="list-view" hidden>
    <div class="subbar"><h1>Upcoming</h1><span id="list-count" class="count"></span></div>
    <div id="list"></div>
  </div>
</main>

<form id="quick" class="quick" autocomplete="off">
  <input id="quick-input" type="text" placeholder="add" aria-label="Quick add">
</form>

<div class="corner">
  <div id="clock" class="clock"><span class="t"></span><span class="d"></span></div>
</div>

<div id="empty-state" class="empty-state" hidden>
  <h1>nothing loaded.</h1>
  <p>Open <button type="button" class="text inline" data-open-settings>Settings</button> and enter your passphrase.</p>
</div>

<script src="bg.js?v=16"></script>
<script src="ics.js?v=16"></script>
<script src="app.js?v=16"></script>
</body>
</html>
